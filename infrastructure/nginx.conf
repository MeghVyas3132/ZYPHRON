user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Docker DNS resolver - allows dynamic DNS resolution
    resolver 127.0.0.11:53 valid=10s;
    resolver_timeout 5s;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/javascript application/json;

    # Main Frontend Domain (localhost and yourdomain.com)
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name localhost yourdomain.com www.yourdomain.com;
        client_max_body_size 100M;

        # Logging
        access_log /var/log/nginx/frontend_access.log;
        error_log /var/log/nginx/frontend_error.log;

        # Frontend proxy
        location / {
            set $upstream_host "frontend:3000";
            proxy_pass http://$upstream_host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }

    # API Backend (api.localhost)
    server {
        listen 80;
        listen [::]:80;
        server_name api.localhost;
        client_max_body_size 100M;

        # Logging
        access_log /var/log/nginx/api_access.log;
        error_log /var/log/nginx/api_error.log;

        # Route to backend
        location / {
            set $upstream_host "backend:8000";
            proxy_pass http://$upstream_host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }

    # Catch-all for subdomains pointing to backend (*.yourdomain.com)
    server {
        listen 80;
        listen [::]:80;
        server_name ~^(?<subdomain>.+)\.yourdomain\.com$;
        client_max_body_size 100M;

        # Logging
        access_log /var/log/nginx/subdomain_access_$subdomain.log;
        error_log /var/log/nginx/subdomain_error_$subdomain.log;

        # Route to backend
        location / {
            set $upstream_host "backend:8000";
            proxy_pass http://$upstream_host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Subdomain $subdomain;
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
}
