version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: zyphron_postgres
    environment:
      POSTGRES_USER: zyphron
      POSTGRES_PASSWORD: zyphron
      POSTGRES_DB: zyphron
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zyphron"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zyphron_network

  # pgAdmin - Database Management UI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: zyphron_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@zyphron.dev
      PGADMIN_DEFAULT_PASSWORD: zyphron
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - zyphron_network
    depends_on:
      - postgres
    restart: unless-stopped

  # Redis for caching and background tasks
  redis:
    image: redis:7-alpine
    container_name: zyphron_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zyphron_network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zyphron_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://zyphron:zyphron@postgres:5432/zyphron
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-change-in-production
      - JWT_SECRET_KEY=dev-jwt-secret-key-change-in-production
      - DOCKER_HOST=unix:///var/run/docker.sock
      - JENKINS_URL=http://zyphron_jenkins:8080
      - JENKINS_TOKEN=dev-jenkins-token
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - zyphron_network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zyphron_frontend
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - zyphron_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: zyphron_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/certs:/etc/letsencrypt:ro
      - /var/log/nginx:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - zyphron_network
    restart: unless-stopped

  # Jenkins CI/CD Pipeline
  jenkins:
    image: jenkins/jenkins:lts
    container_name: zyphron_jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - JENKINS_OPTS=--httpPort=8080
    networks:
      - zyphron_network
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
  jenkins_data:

networks:
  zyphron_network:
    driver: bridge
